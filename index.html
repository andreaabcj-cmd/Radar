<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Radar Diário</title>
<meta name="theme-color" content="#0D0E12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Radar">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --ink:#0D0E12;--panel:#15171D;--line:#23262E;--text:#ECE8E0;--mute:#8E929B;--faint:#5D616A;--star:#F2C46D;--focus:#B7A8FF;
  --c-ia:#B2A6FF;--c-games:#79D3AC;--c-tec:#7DB6FF;--c-mundo:#F2A27C;--c-brasil:#E4CF6F;--c-economia:#D8B48C;--c-ciencia:#7FD3DF;--c-esportes:#F38FA6;--c-cultura:#CDA5EC;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--text)}
body{font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:6px}
[hidden]{display:none!important}

.shell{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:1fr}
@media(min-width:900px){.shell{grid-template-columns:220px minmax(0,1fr);gap:48px}}

.top{position:sticky;top:0;z-index:5;background:var(--ink);border-bottom:1px solid var(--line);
  padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.mast{display:flex;align-items:center;gap:6px;max-width:1120px;margin:0 auto}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:1.65rem;letter-spacing:-.02em;margin:0;line-height:1}
.brand h1 i{font-style:normal;color:var(--mute);font-weight:500}
.ed{font-family:var(--f-mono);font-size:.7rem;color:var(--mute);letter-spacing:.04em;white-space:nowrap;margin-right:4px}
.spacer{flex:1}
.iconbtn{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;color:var(--mute)}
.iconbtn:hover{color:var(--text);background:var(--panel)}
.iconbtn.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.search{max-width:1120px;margin:10px auto 0;display:flex}
.search input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:10px 14px;font:inherit;font-size:1rem}
.search input::placeholder{color:var(--faint)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:12px 4px;margin:0 -4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;border:1px solid var(--line);color:var(--mute);font-size:.88rem;white-space:nowrap}
.chip[aria-current="true"]{color:var(--ink);background:var(--text);border-color:var(--text)}
.chip .dot{width:7px;height:7px}
@media(min-width:900px){.chips{display:none}}

.rail{display:none}
@media(min-width:900px){
  .rail{display:block;position:sticky;top:100px;align-self:start;padding:28px 0 0 max(16px,env(safe-area-inset-left,0px))}
  .rail nav{display:flex;flex-direction:column;gap:2px}
  .rail button{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;color:var(--mute);text-align:left;font-size:.95rem}
  .rail button:hover,.rail button[aria-current="true"]{color:var(--text);background:var(--panel)}
  .rail .count{margin-left:auto;font-family:var(--f-mono);font-size:.72rem;color:var(--faint);font-variant-numeric:tabular-nums}
  .rail hr{border:0;border-top:1px solid var(--line);margin:10px 12px}
}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c,var(--mute));flex:none}

main{min-width:0;padding:24px max(16px,env(safe-area-inset-right,0px)) 64px max(16px,env(safe-area-inset-left,0px))}
.col{max-width:680px}
.kicker{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);display:flex;align-items:center;gap:8px;margin:0 0 6px}
.view-title{font-family:var(--f-display);font-weight:700;font-size:clamp(1.7rem,5vw,2.3rem);letter-spacing:-.02em;line-height:1.1;margin:0 0 4px;text-wrap:balance}
.view-sub{color:var(--mute);margin:0 0 20px;font-size:.95rem}

.lead{padding:22px 0 26px;border-bottom:1px solid var(--line);position:relative}
.lead h2{font-family:var(--f-display);font-weight:700;font-size:clamp(1.5rem,5.4vw,2.1rem);line-height:1.12;letter-spacing:-.015em;margin:8px 48px 10px 0;text-wrap:balance}
.lead p{color:#C9C5BD;margin:0;font-size:1.04rem;max-width:62ch}
.list{display:flex;flex-direction:column}
.item{position:relative;padding:18px 0;border-bottom:1px solid var(--line)}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-family:var(--f-mono);font-size:.72rem;color:var(--mute);letter-spacing:.02em;padding-right:48px}
.meta .cat{color:var(--c);font-weight:500;text-transform:uppercase;letter-spacing:.08em}
.meta .new{color:var(--ink);background:var(--star);border-radius:4px;padding:1px 6px;font-weight:500}
.item h3{font-family:var(--f-display);font-weight:500;font-size:1.18rem;line-height:1.3;margin:6px 48px 6px 0;text-wrap:balance}
.item h3 a,.lead h2 a{text-decoration:none}
.item h3 a:hover,.lead h2 a:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}
.item p{margin:0;color:#BDB9B1;font-size:.97rem;max-width:62ch}
.star{position:absolute;top:14px;right:-6px;width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--faint)}
.lead .star{top:18px}
.star:hover{color:var(--text);background:var(--panel)}
.star[aria-pressed="true"]{color:var(--star)}
.star[aria-pressed="true"] svg path{fill:currentColor}

.section{margin-top:40px}
.section-head{display:flex;align-items:center;gap:10px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.section-head h2{font-family:var(--f-display);font-weight:700;font-size:1.25rem;margin:0;letter-spacing:-.01em}
.more{margin-left:auto;font-size:.85rem;color:var(--mute);padding:6px 4px}
.more:hover{color:var(--text)}
.empty{padding:40px 0;color:var(--mute);max-width:44ch}
.empty strong{display:block;color:var(--text);font-family:var(--f-display);font-size:1.2rem;margin-bottom:6px;font-weight:500}
.foot{margin-top:48px;font-family:var(--f-mono);font-size:.72rem;color:var(--faint);letter-spacing:.03em}
.foot summary{cursor:pointer}
.foot ul{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:4px}
.foot .bad{color:var(--c-esportes)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--ink);padding:9px 16px;border-radius:999px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){.toast{transition:none}.iconbtn.spin svg{animation:none}}
</style>
</head>
<body>
<header class="top">
  <div class="mast">
    <div class="brand"><h1>Radar <i>Diário</i></h1></div>
    <span class="spacer"></span>
    <span class="ed" id="edLabel"></span>
    <button class="iconbtn" id="reloadBtn" aria-label="Recarregar notícias">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
    </button>
    <button class="iconbtn" id="searchBtn" aria-label="Buscar notícias" aria-expanded="false">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    </button>
  </div>
  <div class="search" id="searchRow" hidden>
    <input id="q" type="search" placeholder="Buscar em todas as notícias" autocomplete="off">
  </div>
  <nav class="chips" id="chips" aria-label="Temas"></nav>
</header>

<div class="shell">
  <aside class="rail"><nav id="rail" aria-label="Temas"></nav></aside>
  <main><div class="col" id="view"></div></main>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const CATS=[
  {id:'ia',name:'IA',full:'Inteligência artificial'},
  {id:'games',name:'Games',full:'Games'},
  {id:'tec',name:'Tecnologia',full:'Tecnologia'},
  {id:'mundo',name:'Mundo',full:'Mundo'},
  {id:'brasil',name:'Brasil',full:'Brasil'},
  {id:'economia',name:'Economia',full:'Economia e mercados'},
  {id:'ciencia',name:'Ciência',full:'Ciência'},
  {id:'esportes',name:'Esportes',full:'Esportes'},
  {id:'cultura',name:'Cultura',full:'Cultura e entretenimento'}
];
const CAT=Object.fromEntries(CATS.map(c=>[c.id,c]));
const TABS=['inicio',...CATS.map(c=>c.id),'favoritos'];
const S={articles:[],updatedAt:0,fontes:[],favs:new Map(),tab:'inicio',q:'',loaded:false,error:false};

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STAR='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8L3.5 9.7l5.9-.9z"/></svg>';

const store={
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const prevVisit=store.get('radar.lastVisit',0);
store.set('radar.lastVisit',Date.now());
store.get('radar.favs',[]).forEach(a=>S.favs.set(a.id,a));

function quando(ts){
  if(!ts)return '';
  const m=Math.round((Date.now()-ts)/6e4);
  if(m<1)return 'agora';
  if(m<60)return `há ${m} min`;
  const h=Math.round(m/60);
  if(h<24)return `há ${h} h`;
  const d=new Date(ts);
  return d.toLocaleDateString('pt-BR',{day:'numeric',month:'short'}).replace('.','');
}
const isNew=a=>prevVisit&&a.ts>prevVisit;

function metaHTML(a,showCat){
  const c=CAT[a.cat]||{name:a.cat};
  return `<div class="meta">${showCat?`<span class="dot" style="--c:var(--c-${esc(a.cat)})"></span><span class="cat" style="--c:var(--c-${esc(a.cat)})">${esc(c.name)}</span>`:''}<span>${esc(a.source)}</span><span>${esc(quando(a.ts))}</span>${isNew(a)?'<span class="new">novo</span>':''}</div>`;
}
function starBtn(a){
  const on=S.favs.has(a.id);
  return `<button class="star" data-fav="${esc(a.id)}" aria-pressed="${on}" aria-label="${on?'Tirar dos favoritos':'Guardar nos favoritos'}">${STAR}</button>`;
}
const link=(a,t)=>`<a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(t)}</a>`;
const itemHTML=(a,showCat)=>`<article class="item">${metaHTML(a,showCat)}<h3>${link(a,a.title)}</h3>${a.summary?`<p>${esc(a.summary)}</p>`:''}${starBtn(a)}</article>`;
const leadHTML=a=>`<article class="lead">${metaHTML(a,true)}<h2>${link(a,a.title)}</h2>${a.summary?`<p>${esc(a.summary)}</p>`:''}${starBtn(a)}</article>`;

function navHTML(kind){
  const cnt=id=>id==='favoritos'?S.favs.size:id==='inicio'?S.articles.length:S.articles.filter(a=>a.cat===id).length;
  const label=id=>id==='inicio'?'Início':id==='favoritos'?'Favoritos':CAT[id].name;
  const dot=id=>CAT[id]?`<span class="dot" style="--c:var(--c-${id})"></span>`:id==='favoritos'?`<span class="dot" style="--c:var(--star)"></span>`:'';
  const cur=id=>S.tab===id&&!S.q;
  if(kind==='chip')return TABS.map(id=>`<button class="chip" data-tab="${id}" aria-current="${cur(id)}">${dot(id)}${label(id)}</button>`).join('');
  return TABS.map(id=>`${id==='favoritos'?'<hr>':''}<button data-tab="${id}" aria-current="${cur(id)}">${dot(id)}${label(id)}<span class="count">${S.loaded?cnt(id):''}</span></button>`).join('');
}

/* home: the freshest story leads, then a few fresh ones from each theme */
function render(){
  $('#chips').innerHTML=navHTML('chip');
  $('#rail').innerHTML=navHTML('rail');
  $('#edLabel').textContent=S.updatedAt?'ATUALIZADO '+quando(S.updatedAt).toUpperCase():'';
  const v=$('#view');
  const arts=[...S.articles].sort((a,b)=>b.ts-a.ts);
  let h='';

  if(!S.loaded){v.innerHTML=`<div class="empty"><strong>Abrindo a edição…</strong>As notícias aparecem aqui em um instante.</div>`;return}
  if(S.q){
    const q=S.q.toLowerCase();
    const r=arts.filter(a=>(a.title+' '+a.summary+' '+a.source).toLowerCase().includes(q));
    h=`<p class="kicker">Busca</p><h2 class="view-title">“${esc(S.q)}”</h2><p class="view-sub">${r.length} ${r.length===1?'resultado':'resultados'}</p>`;
    h+=r.length?`<div class="list">${r.map(a=>itemHTML(a,true)).join('')}</div>`:`<div class="empty"><strong>Nada encontrado</strong>Tente outra palavra, como o nome de uma empresa, jogo ou país.</div>`;
    v.innerHTML=h;return;
  }
  if(!arts.length&&S.tab!=='favoritos'){
    v.innerHTML=S.error
      ?`<div class="empty"><strong>Sem conexão com as notícias</strong>Confira a internet e toque no botão de recarregar, lá em cima. Seus favoritos continuam na aba Favoritos.</div>`
      :`<div class="empty"><strong>A primeira edição ainda está sendo montada</strong>O robô busca as notícias a cada hora. Volte em alguns minutos e toque em recarregar.</div>`;
    return;
  }

  if(S.tab==='inicio'){
    const today=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
    const pick=CATS.map(c=>arts.find(a=>a.cat===c.id)).filter(Boolean).sort((a,b)=>b.ts-a.ts);
    const lead=pick[0];
    h+=`<p class="kicker">${esc(today)}</p>`+leadHTML(lead);
    for(const c of CATS){
      const list=arts.filter(a=>a.cat===c.id&&a!==lead);
      if(!list.length)continue;
      h+=`<section class="section"><div class="section-head"><span class="dot" style="--c:var(--c-${c.id})"></span><h2>${c.full}</h2><button class="more" data-tab="${c.id}">Ver tudo (${arts.filter(a=>a.cat===c.id).length})</button></div><div class="list">${list.slice(0,3).map(a=>itemHTML(a,false)).join('')}</div></section>`;
    }
  }else if(S.tab==='favoritos'){
    const f=[...S.favs.values()].sort((a,b)=>(b.savedAt||0)-(a.savedAt||0));
    h+=`<p class="kicker"><span class="dot" style="--c:var(--star)"></span>Guardadas</p><h2 class="view-title">Favoritos</h2><p class="view-sub">${f.length?`${f.length} ${f.length===1?'notícia guardada':'notícias guardadas'} neste aparelho.`:''}</p>`;
    h+=f.length?`<div class="list">${f.map(a=>itemHTML(a,true)).join('')}</div>`:`<div class="empty"><strong>Nada guardado ainda</strong>Toque na estrela ao lado de qualquer notícia e ela fica salva aqui, mesmo depois que sair da edição.</div>`;
  }else{
    const c=CAT[S.tab];const list=arts.filter(a=>a.cat===c.id);
    h+=`<p class="kicker"><span class="dot" style="--c:var(--c-${c.id})"></span>Tema</p><h2 class="view-title">${c.full}</h2><p class="view-sub">${list.length} ${list.length===1?'notícia':'notícias'} dos últimos dias</p>`;
    h+=list.length?`<div class="list">${list.map(a=>itemHTML(a,false)).join('')}</div>`:`<div class="empty"><strong>Sem notícias deste tema agora</strong>Na próxima atualização elas devem aparecer.</div>`;
  }
  if(S.fontes.length){
    const bad=S.fontes.filter(f=>!f.ok);
    h+=`<details class="foot"><summary>${S.fontes.length-bad.length} de ${S.fontes.length} fontes funcionando · atualiza sozinho a cada hora</summary><ul>${S.fontes.map(f=>`<li class="${f.ok?'':'bad'}">${f.ok?'✓':'✕'} ${esc(f.name)} · ${esc(CAT[f.cat]?.name||f.cat)}${f.ok?` · ${f.n}`:` · ${esc(f.erro||'falhou')}`}</li>`).join('')}</ul></details>`;
  }
  v.innerHTML=h;
}

function go(tab){
  if(!TABS.includes(tab))tab='inicio';
  S.tab=tab;S.q='';$('#q').value='';
  try{history.replaceState(null,'',tab==='inicio'?location.pathname:'#'+tab)}catch(e){}
  render();window.scrollTo({top:0});
}
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),1800)}

function toggleFav(id){
  const a=S.favs.get(id)||S.articles.find(x=>x.id===id);if(!a)return;
  const on=S.favs.has(id);
  if(on)S.favs.delete(id);else S.favs.set(id,{...a,savedAt:Date.now()});
  store.set('radar.favs',[...S.favs.values()]);
  render();toast(on?'Removida dos favoritos':'Guardada nos favoritos');
}

async function load(manual){
  const btn=$('#reloadBtn');btn.classList.add('spin');
  try{
    const r=await fetch('news.json?t='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error(r.status);
    const d=await r.json();
    S.articles=d.articles||[];S.updatedAt=d.updatedAt||0;S.fontes=d.fontes||[];S.error=false;
    store.set('radar.cache',d);
    if(manual)toast('Notícias atualizadas');
  }catch(e){
    const c=store.get('radar.cache',null);
    if(c&&!S.articles.length){S.articles=c.articles||[];S.updatedAt=c.updatedAt||0;S.fontes=c.fontes||[]}
    S.error=true;if(manual)toast('Sem conexão. Mostrando a última edição salva.');
  }
  S.loaded=true;btn.classList.remove('spin');render();
}

document.addEventListener('click',e=>{
  const f=e.target.closest('[data-fav]');if(f){toggleFav(f.dataset.fav);return}
  const t=e.target.closest('[data-tab]');if(t)go(t.dataset.tab);
});
$('#reloadBtn').addEventListener('click',()=>load(true));
$('#searchBtn').addEventListener('click',()=>{
  const row=$('#searchRow');row.hidden=!row.hidden;$('#searchBtn').setAttribute('aria-expanded',String(!row.hidden));
  if(!row.hidden)$('#q').focus();else{S.q='';$('#q').value='';render()}
});
let qT;$('#q').addEventListener('input',e=>{clearTimeout(qT);qT=setTimeout(()=>{S.q=e.target.value.trim();render()},150)});
window.addEventListener('hashchange',()=>go(location.hash.slice(1)));
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-S.updatedAt>36e5)load()});

S.tab=TABS.includes(location.hash.slice(1))?location.hash.slice(1):'inicio';
render();load();
</script>
</body>
</html>
